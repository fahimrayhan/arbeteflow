services:
  mongodb:
    image: mongo:8
    container_name: arbeteflow-mongodb
    restart: unless-stopped
    # WiredTiger otherwise reserves ~50% of host RAM for its cache; this dataset is tiny.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: jobfinder
      GLIBC_TUNABLES: "glibc.pthread.rseq=1"
    volumes:
      - jobfinder_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M

  jobs-service:
    build:
      context: ./jobs-service
      dockerfile: Dockerfile
    container_name: arbeteflow-jobs-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      EMBEDDING_THREADS: ${EMBEDDING_THREADS:-2}
      OMP_NUM_THREADS: ${EMBEDDING_THREADS:-2}
      JOB_TTL_DAYS: ${JOB_TTL_DAYS:-30}
    volumes:
      - jobs_vector_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          # Measured: ~0.5 GB steady, ~0.6 GB peak while indexing.
          memory: 768M

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: arbeteflow-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PORT: 8787
      CLIENT_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      MONGODB_URI: mongodb://mongodb:27017/jobfinder
      MONGODB_DB_NAME: jobfinder
      JOBS_SERVICE_URL: http://jobs-service:8000
      MODEL_BASE_URL: http://host.docker.internal:8000
      MODEL_NAME: ${MODEL_NAME:-Qwen/Qwen2-VL-2B-Instruct}
      MODEL_API_KEY: ${MODEL_API_KEY:-local-dev-secret}
      ALLOW_DEVELOPMENT_AUTH: "true"
      # Optional. When empty, a random key is generated into the api_data volume.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      # Optional. Enables "Research the company on the web" in the cover letter generator.
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - api_data:/app/.data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
      jobs-service:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  jobfinder_mongodb_data:
  # Encryption key for stored provider API keys — kept apart from the database on purpose.
  api_data:
  # Replaces the old `chroma_jobs_data` volume (PyTorch-era index). It is rebuilt
  # automatically from Arbetsförmedlingen on first start.
  jobs_vector_data:
